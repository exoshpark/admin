:root{--sidebar-open:252px;--sidebar-closed:76px;--topbar:64px;--nav:#111827;--nav2:#0d1320;--text:#1f2937;--muted:#667085;--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--hover:rgba(255,255,255,.06);--selected:rgba(255,255,255,.10);--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Pretendard","IBM Plex Sans KR","Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}button,input,select{font:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar-open) 1fr;transition:grid-template-columns .2s ease}.app.collapsed{grid-template-columns:var(--sidebar-closed) 1fr}.sidebar{height:100vh;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#d1d5db;display:flex;flex-direction:column;min-width:0;overflow:hidden}.brand{height:78px;min-height:78px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;position:relative;border-bottom:1px solid rgba(255,255,255,.06)}.logo{width:34px;height:34px;min-width:34px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.18)}.logo img{width:24px;height:24px;object-fit:contain;display:block}.brand-text{min-width:0;white-space:nowrap;overflow:hidden;flex:1}.brand-text b{display:block;color:#fff;font-size:15px}.brand-text span{display:block;color:#8b95a7;font-size:11px;margin-top:2px}.brand-actions{display:flex;align-items:center;gap:6px;margin-left:auto}.nav-tool-btn{width:32px;height:32px;border:1px solid rgba(255,255,255,.14);background:#1f2937;color:#fff;border-radius:10px;display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 8px 18px rgba(0,0,0,.14);font-size:15px;line-height:1}.nav-tool-btn:hover{background:#273244}.nav-tool-btn.active{background:#374151;border-color:rgba(255,255,255,.24)}.app.collapsed .brand{justify-content:center;padding:8px 0 10px;flex-direction:column;gap:6px}.app.collapsed .brand-text{display:none}.app.collapsed .brand-actions{margin-left:0;gap:4px}.app.collapsed .nav-tool-btn{width:28px;height:28px;border-radius:9px;font-size:13px}.app.collapsed .logo{position:static;transform:none;width:30px;height:30px;min-width:30px;border-radius:9px}

 {id:'agents',label:'에이전트',icon:'🖥️',children:[{id:'agents.deploy',label:'에이전트 배포',icon:'📦'},{id:'agents.status',label:'현황 및 삭제',icon:'🧹'},{id:'agents.security',label:'보안 설정',icon:'🔒'}]},
 {id:'policy',label:'보안정책',icon:'⚙️',children:[
  {id:'policy.system',label:'시스템 보안',icon:'🛡️',children:[{id:'policy.av',label:'안티바이러스',short:'안'},{id:'policy.ransom',label:'랜섬웨어방지',short:'랜'},{id:'policy.web',label:'웹보호',short:'웹'}]},
  {id:'policy.data',label:'데이터 보안',icon:'🔐',children:[{id:'policy.privacy',label:'개인정보보호',short:'개'},{id:'policy.device',label:'매체제어',short:'매'},{id:'policy.file',label:'애플리케이션 제어',short:'앱'},{id:'policy.capture',label:'화면캡처 제어',short:'캡'},{id:'policy.print',label:'출력물 제어',short:'출'}]},
  {id:'policy.access',label:'접근 제어',icon:'🚪',children:[{id:'policy.appAccess',label:'애플리케이션 접근제어',short:'접'}]}
 ]},
 {id:'approval',label:'승인관리',icon:'✅',children:[{id:'approval.device',label:'매체제어 승인',short:'USB'},{id:'approval.file',label:'파일반출 승인',icon:'📤'},{id:'approval.print',label:'출력물 승인',icon:'🖨️'},{id:'approval.access',label:'접근제어 승인',icon:'🚪'}]},
 {id:'service',label:'서비스관리',icon:'🧩',children:[{id:'service.subscription',label:'구독관리',icon:'💳'},{id:'service.openapi',label:'Open API',short:'API'},{id:'service.webhook',label:'Webhook',icon:'🔗'},{id:'service.audit',label:'감사로그',icon:'🧾'}]},
 {id:'studio',label:'개발 Studio',icon:'🛠️',children:[{id:'studio.pages',label:'페이지 관리',icon:'📄'},{id:'studio.api',label:'API 설정',icon:'🔧'}]}

function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function icon(n){if(n.icon)return '<span class="ico">'+n.icon+'</span>'; return '<span class="short">'+esc(n.short||'·')+'</span>';}
function allLeafPages(nodes=menuData, path=[]){let out=[]; nodes.forEach(n=>{const p=path.concat(n.label); if(n.children) out=out.concat(allLeafPages(n.children,p)); else if(!n.id.startsWith('studio.')) out.push({id:n.id,label:n.label,path:p.join(' / ')});}); return out;}
function findNode(id,nodes=menuData){for(const n of nodes){if(n.id===id)return n; if(n.children){const f=findNode(id,n.children); if(f)return f;}} return null;}
function defaults(){const o={}; allLeafPages().forEach((p,i)=>o[p.id]={active:true,html:'',fileName:'',updatedAt:'-',sort:i}); return o;}
function loadPages(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'));}catch(e){return defaults();}}
function savePages(state){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function statusHtml(row){return row&&row.active?'<span class="status on">활성</span>':'<span class="status off">비활성</span>';}
function revokeUrls(){objectUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}}); objectUrls=[];}
function makeBlobUrl(html){const blob=new Blob([html],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob); objectUrls.push(url); return url;}
function getApiKeys(){try{return {ak:localStorage.getItem(ACCESS_KEY)||'',sk:localStorage.getItem(SECRET_KEY)||'',lang:localStorage.getItem('exosp_lang')||'ko'};}catch(e){return {ak:'',sk:'',lang:'ko'};}}
function setApiKeys(ak,sk){localStorage.setItem(ACCESS_KEY,ak||''); localStorage.setItem(SECRET_KEY,sk||'');}
function pageUrlWithKeys(html){const c=getApiKeys(); const url=makeBlobUrl(html); const hash='ak='+encodeURIComponent(c.ak)+'&sk='+encodeURIComponent(c.sk)+'&lang='+encodeURIComponent(c.lang||'ko'); return url+'#'+hash;}
function hasVisibleLeaf(node,state){if(!node.children)return node.id.startsWith('studio.') || (state[node.id]&&state[node.id].active); return node.children.some(c=>hasVisibleLeaf(c,state));}
function renderMenu(){const state=loadPages(); $('menu').innerHTML=menuData.filter(n=>hasVisibleLeaf(n,state)).map(n=>renderNode(n,1,state)).join(''); setActive(currentPage);}
function renderNode(n,level,state){const children=(n.children||[]).filter(c=>hasVisibleLeaf(c,state)); const has=children.length>0; if(has){const cls=level===1?'menu-title':'sub-title level-'+level; const openClass=menuAllOpen?' open':''; return '<div class="menu-section'+openClass+'" data-node="'+esc(n.id)+'"><button type="button" class="'+cls+'" data-toggle="'+esc(n.id)+'" data-tip="'+esc(n.label)+'">'+icon(n)+'<span class="label">'+esc(n.label)+'</span><span class="chev">›</span></button><div class="children">'+children.map(c=>renderNode(c,level+1,state)).join('')+'</div></div>';}
 return '<button type="button" class="menu-link level-'+level+'" data-page="'+esc(n.id)+'" data-tip="'+esc(n.label)+'">'+icon(n)+'<span class="label">'+esc(n.label)+'</span></button>';}
function setActive(id){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));}
function openPage(id){currentPage=id; const n=findNode(id)||{label:'페이지'}; $('pageTitle').textContent=n.label; $('pageDesc').textContent='엑소스피어 관리자 콘솔 / '+n.label; setActive(id); if(id==='studio.pages')return renderPageManager(); if(id==='studio.api')return renderApiSettings(); renderUserPage(id,n);}
function renderUserPage(id,n){revokeUrls(); const state=loadPages(); const row=state[id]; if(row&&row.html){const url=pageUrlWithKeys(row.html); $('content').innerHTML='<iframe class="page-frame" src="'+url+'" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>'; return;}
 $('content').innerHTML='<div class="hero"><h2>'+esc(n.label)+'</h2><p>아직 업로드된 HTML이 없어 기본 화면을 표시합니다. 개발 Studio &gt; 페이지 관리에서 이 메뉴에 HTML을 업로드하면 메뉴 클릭 시 실제 업로드 화면이 열립니다.</p></div><div class="grid cols-4"><div class="card metric"><p>전체 단말</p><strong>1,284</strong><br><span class="pill">정상</span></div><div class="card metric"><p>보안 이벤트</p><strong>327</strong><br><span class="pill">오늘</span></div><div class="card metric"><p>정책 적용률</p><strong>98.2%</strong><br><span class="pill">운영</span></div><div class="card metric"><p>승인 대기</p><strong>14</strong><br><span class="pill">확인 필요</span></div></div><div class="section-head"><h2>'+esc(n.label)+' 상세</h2><p>페이지 업로드 전 기본 관리자 화면입니다.</p></div><table class="table"><thead><tr><th>동작</th><th>상태</th><th>설명</th></tr></thead><tbody><tr><td>메뉴 클릭</td><td>동작</td><td>업로드된 HTML이 있으면 iframe 실제 화면으로 렌더링합니다.</td></tr><tr><td>페이지 다운로드</td><td>동작</td><td>페이지 관리에 저장된 원본 HTML 파일을 다운로드합니다.</td></tr><tr><td>미리보기</td><td>동작</td><td>HTML 코드가 아니라 실제 화면을 iframe으로 보여줍니다.</td></tr></tbody></table>';
}
function renderPageManager(){revokeUrls(); const pages=allLeafPages(); const state=loadPages(); if(!state[selectedManagePage]) selectedManagePage=pages[0].id; const page=pages.find(p=>p.id===selectedManagePage)||pages[0]; const row=state[page.id]; const preview = row.html ? '<iframe id="previewFrame" class="preview-frame" src="'+pageUrlWithKeys(row.html)+'" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>' : '<div class="empty"><div><b>미리보기 할 HTML이 없습니다.</b><br>HTML 파일을 업로드하면 실제 화면으로 표시됩니다.</div></div>';
 $('content').innerHTML='<div class="hero"><h2>페이지 관리</h2><p>메뉴별 페이지 HTML을 업로드하면 해당 메뉴 클릭 시 업로드한 실제 화면이 표시됩니다. 미리보기는 코드가 아니라 iframe 화면으로 렌더링합니다.</p></div><div class="studio-layout"><aside class="studio-side"><h3>메뉴 페이지 목록</h3><div class="page-list">'+pages.map(p=>'<button class="page-row '+(p.id===page.id?'active':'')+'" data-manage-page="'+esc(p.id)+'"><span><b>'+esc(p.label)+'</b><span>'+esc(p.path)+'</span></span>'+statusHtml(state[p.id])+'</button>').join('')+'</div></aside><section class="card"><div class="toolbar"><div class="left"><span class="pill">'+esc(page.path)+'</span>'+statusHtml(row)+'</div><div class="right"><button class="btn" id="openAsMenuBtn">메뉴 화면으로 보기</button><button class="btn" id="downloadPageBtn">HTML 다운로드</button><button class="btn danger" id="clearPageBtn">업로드 제거</button><button class="btn primary" id="savePageBtn">설정 저장</button></div></div><div class="form-grid"><div class="field"><label>페이지 ID</label><input class="input" value="'+esc(page.id)+'" disabled></div><div class="field"><label>활성화</label><div style="height:42px;display:flex;align-items:center;gap:10px"><label class="switch"><input id="activeInput" type="checkbox" '+(row.active?'checked':'')+'><span class="slider"></span></label><span>'+(row.active?'메뉴에 노출':'메뉴에서 숨김')+'</span></div></div></div><div class="section-head"><h2>HTML 업로드</h2><p>선택한 메뉴에 연결할 단일 HTML 파일을 업로드합니다. 저장 위치는 브라우저 localStorage입니다.</p></div><label class="filebox"><input id="htmlFileInput" type="file" accept=".html,text/html"><b>HTML 파일 선택</b><br><span style="color:#667085;font-size:12px">현재 파일: '+esc(row.fileName||'등록된 파일 없음')+' / 최종 수정: '+esc(row.updatedAt||'-')+'</span></label><div class="section-head"><h2>실제 화면 미리보기</h2><p>저장된 HTML을 iframe/blob로 열어 실제 화면처럼 확인합니다.</p></div>'+preview+'</section></div>';
}
function uploadHtml(file){const reader=new FileReader(); reader.onload=()=>{const state=loadPages(); state[selectedManagePage].html=String(reader.result||''); state[selectedManagePage].fileName=file.name; state[selectedManagePage].updatedAt=new Date().toLocaleString('ko-KR'); savePages(state); renderMenu(); renderPageManager();}; reader.readAsText(file);}
function downloadCurrentPage(){const state=loadPages(); const row=state[selectedManagePage]; const page=allLeafPages().find(p=>p.id===selectedManagePage)||{label:selectedManagePage}; const html=row.html || '<!doctype html>\n<html lang="ko">\n<head><meta charset="utf-8"><title>'+page.label+'</title></head>\n<body><h1>'+page.label+'</h1></body>\n</html>'; const a=document.createElement('a'); a.href=makeBlobUrl(html); a.download=row.fileName || selectedManagePage.replace(/\./g,'_')+'.html'; document.body.appendChild(a); a.click(); a.remove();}
function saveCurrentMeta(){const state=loadPages(); state[selectedManagePage].active=$('activeInput').checked; state[selectedManagePage].updatedAt=new Date().toLocaleString('ko-KR'); savePages(state); renderMenu(); renderPageManager();}
function clearCurrentPage(){const state=loadPages(); state[selectedManagePage].html=''; state[selectedManagePage].fileName=''; state[selectedManagePage].updatedAt=new Date().toLocaleString('ko-KR'); savePages(state); renderPageManager();}
function renderApiSettings(){const keys=getApiKeys(); const saved=!!(keys.ak&&keys.sk); $('content').innerHTML='<div class="hero"><h2>API 설정</h2><p>각 페이지에서 API 서버에 연결할 때 사용할 Access Key와 Secret Key를 저장합니다. 저장된 키는 메뉴 페이지와 미리보기 iframe을 열 때 URL hash(#ak, #sk)로 자동 전달됩니다.</p></div><section class="card"><div class="toolbar"><div class="left"><span class="pill">'+(saved?'키 저장됨':'키 미저장')+'</span></div><div class="right"><button class="btn danger" id="clearApiKeysBtn">키 삭제</button><button class="btn primary" id="saveApiKeysBtn">키 저장</button></div></div><div class="form-grid"><div class="field"><label>Access Key</label><input id="accessKeyInput" class="input" autocomplete="off" spellcheck="false" value="'+esc(keys.ak)+'" placeholder="Access Key를 입력하세요"></div><div class="field"><label>Secret Key</label><input id="secretKeyInput" class="input" type="password" autocomplete="new-password" spellcheck="false" value="'+esc(keys.sk)+'" placeholder="Secret Key를 입력하세요"></div></div><div class="notice" style="margin-top:14px">저장 후 각 페이지를 열면 <b>#ak=ACCESS_KEY&amp;sk=SECRET_KEY&amp;lang=ko</b> 형식으로 키가 전달됩니다. 업로드한 대시보드가 이 hash 값을 읽어 API 호출에 사용하면 서버 연결이 가능합니다.</div></section>'}
function readApiRows(){return [];}


function updateMenuToolState(){
 const app=$('app');
 const compact=app.classList.contains('collapsed');
 const compactBtn=$('collapseBtn');
 const allBtn=$('toggleAllMenusBtn');
 if(compactBtn){compactBtn.classList.toggle('active',compact); compactBtn.textContent=compact?'»':'☰'; compactBtn.title=compact?'좌측 메뉴 크게 보기':'좌측 메뉴 간략 보기';}
 if(allBtn){allBtn.classList.toggle('active',menuAllOpen); allBtn.textContent=menuAllOpen?'⇈':'⇊'; allBtn.title=menuAllOpen?'전체 메뉴 닫기':'전체 메뉴 펼치기';}
}
function toggleAllMenus(){
 menuAllOpen=!menuAllOpen;
 document.querySelectorAll('#menu .menu-section').forEach(section=>section.classList.toggle('open',menuAllOpen));
 updateMenuToolState();
}

document.addEventListener('click',e=>{
 const t=e.target.closest('button'); if(!t)return;
 if(t.id==='collapseBtn'){$('app').classList.toggle('collapsed'); updateMenuToolState(); return;}
 if(t.id==='toggleAllMenusBtn'){toggleAllMenus();return;}
 if(t.dataset.toggle){const node=t.closest('.menu-section'); if(node)node.classList.toggle('open'); return;}
 if(t.dataset.page){openPage(t.dataset.page);return;}
 if(t.dataset.managePage){selectedManagePage=t.dataset.managePage; renderPageManager();return;}
 if(t.id==='downloadPageBtn'){downloadCurrentPage();return;}
 if(t.id==='savePageBtn'){saveCurrentMeta();return;}
 if(t.id==='clearPageBtn'){clearCurrentPage();return;}
 if(t.id==='openAsMenuBtn'){openPage(selectedManagePage);return;}
 if(t.id==='saveApiKeysBtn'){setApiKeys(($('accessKeyInput')||{}).value||'',($('secretKeyInput')||{}).value||''); renderApiSettings();return;}
 if(t.id==='clearApiKeysBtn'){setApiKeys('',''); renderApiSettings();return;}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='htmlFileInput'&&e.target.files[0]) uploadHtml(e.target.files[0]);});
renderMenu(); openPage(currentPage); updateMenuToolState();
})();
</script>
