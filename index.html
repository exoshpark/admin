:root{--sidebar-open:252px;--sidebar-closed:76px;--topbar:64px;--nav:#111827;--nav2:#0d1320;--text:#1f2937;--muted:#667085;--bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--hover:rgba(255,255,255,.06);--selected:rgba(255,255,255,.10);--radius:12px;--font:-apple-system,BlinkMacSystemFont,"Pretendard","IBM Plex Sans KR","Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}button,input,select{font:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar-open) 1fr;transition:grid-template-columns .2s ease}.app.collapsed{grid-template-columns:var(--sidebar-closed) 1fr}.sidebar{height:100vh;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#d1d5db;display:flex;flex-direction:column;min-width:0;overflow:hidden}.brand{height:78px;min-height:78px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;position:relative;border-bottom:1px solid rgba(255,255,255,.06)}.logo{width:34px;height:34px;min-width:34px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.18)}.logo img{width:24px;height:24px;object-fit:contain;display:block}.brand-text{min-width:0;white-space:nowrap;overflow:hidden;flex:1}.brand-text b{display:block;color:#fff;font-size:15px}.brand-text span{display:block;color:#8b95a7;font-size:11px;margin-top:2px}.brand-actions{display:flex;align-items:center;gap:6px;margin-left:auto}.nav-tool-btn{width:32px;height:32px;border:1px solid rgba(255,255,255,.14);background:#1f2937;color:#fff;border-radius:10px;display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 8px 18px rgba(0,0,0,.14);font-size:15px;line-height:1}.nav-tool-btn:hover{background:#273244}.nav-tool-btn.active{background:#374151;border-color:rgba(255,255,255,.24)}.app.collapsed .brand{justify-content:center;padding:8px 0 10px;flex-direction:column;gap:6px}.app.collapsed .brand-text{display:none}.app.collapsed .brand-actions{margin-left:0;gap:4px}.app.collapsed .nav-tool-btn{width:28px;height:28px;border-radius:9px;font-size:13px}.app.collapsed .logo{position:static;transform:none;width:30px;height:30px;min-width:30px;border-radius:9px}

\/head>\n<body>\n<div class=\"sample-watermark\" id=\"sampleWatermark\">샘플 데이터 표시 중<\/div>\n<div class=\"shell\">\n<header><span class=\"logo-text\" data-i18n=\"title\">PC보안점검현황<\/span><div class=\"header-right\"><div class=\"status-badge err\" id=\"statusBadge\"><span class=\"status-dot\"><\/span><span class=\"status-spinner\"><\/span><span id=\"statusText\">미연결<\/span><\/div><button class=\"btn\" id=\"refreshBtn\" onclick=\"handleRefresh()\">↻ <span data-i18n=\"refresh\">새로고침<\/span><\/button><button class=\"btn btn-primary\" onclick=\"openApiModal()\" data-i18n=\"apiKeys\">API 키 설정<\/button><button class=\"btn\" id=\"demoToggleBtn\" onclick=\"toggleDemoMode()\">데모<\/button><\/div><\/header>\n<main class=\"main\">\n<section class=\"hero\"><p data-i18n=\"hero\">PC보안점검 현재 상태를 점수화하여 점수 구간, 부서 평균, 취약 점검항목, PC별 상세 현황을 카드 형태로 확인합니다.<\/p><div class=\"controls\"><select id=\"scoreMode\" class=\"select\" onchange=\"rebuild()\"><option value=\"exclude\" data-i18n=\"excludeUnchecked\">점검안함 제외 계산<\/option><option value=\"include\" data-i18n=\"includeUnchecked\">점검안함 포함 계산<\/option><\/select><\/div><\/section>\n<section class=\"stat-grid\" id=\"statGrid\"><\/section>\n<section class=\"graph-row\"><div class=\"panel score-panel\"><div class=\"panel-title\"><span data-i18n=\"overallScore\">전체 평균 점수<\/span><em class=\"hint\" id=\"scoreModeHint\"><\/em><\/div><div class=\"big-score\" id=\"overallScoreBox\"><strong>0<\/strong><span data-i18n=\"score\">점수<\/span><\/div><div class=\"score-desc\" id=\"overallScoreDesc\"><\/div><\/div><div class=\"panel\"><div class=\"panel-title\"><span data-i18n=\"deptAvg\">부서별 평균 보안 점수<\/span><em class=\"hint\" data-i18n=\"byScore\">점수 기준<\/em><\/div><div id=\"deptBars\" class=\"bars\"><\/div><\/div><div class=\"panel\"><div class=\"panel-title\"><span data-i18n=\"weakTop\">취약 점검항목 TOP<\/span><em class=\"hint\" data-i18n=\"weakCount\">취약/실패 수<\/em><\/div><div id=\"weakBars\" class=\"bars\"><\/div><\/div><\/section>\n<section class=\"toolbar\"><input on',pendingUpdate:'Available/Pending Update',browserVersion:'Browser Version',noPendingUpdate:'No pending updates',status:'Status',rawDetail:'Detail',screenSaver:'Screen Saver',logonRestart:'Logon Screen on Restart',requirePassword:'Require Password',waitTime:'Wait Time',sharedFolder:'Shared Folder Path',lastChange:'Last Changed',reason:'Reason',using:'Using',notUsing:'Not using',latest:'The latest version',secureState:'Secure',updateRequired:'Update required',none:'None',apiFailed:'API call failed',enterKeys:'Please enter both Access Key and Secret Key.',sortScoreAsc:'Lowest score first',sortScoreDesc:'Highest score first',avgDesc:(s,n)=>`Average security score across ${n} PCs.`}};\nconst CHECK_LABELS={updateOperatingSystem:{ko:'운영체제 업데이트',en:'Operating System Update'},enableAntivirus:{ko:'백신 사용',en:'Antivirus Enabled'},enableFirewall:{ko:'방화벽 사용',en:'Firewall Enabled'},useSecurePassword:{ko:'안전한 암호 사용',en:'Secure Password'},changePasswordPeriodically:{ko:'주기적 암호 변경',en:'Periodic Password Change'},changePasswordPeriodcally:{ko:'주기적 암호 변경',en:'Periodic Password Change'},enableScreenSaver:{ko:'화면보호기 설정',en:'Screen Saver Settings'},disableSharedFolder:{ko:'공유 폴더 제한',en:'Shared Folder Restriction'},disableUSBAutoPlay:{ko:'USB 자동실행 차단',en:'USB AutoPlay Disabled'},updateSoftware:{ko:'소프트웨어 업데이트',en:'Software Update'},enableSystemIntegrityProtection:{ko:'시스템 무결성 보호',en:'System Integrity Protection'},blockUnverifiedAppleApps:{ko:'확인되지 않은 앱 차단',en:'Block Unverified Apps'}};\nfunction t(k){return (I18N[currentLang]&&I18N[currentLang][k])||I18N.ko[k]||k}function esc(s){return String(s??'').replace(/[&<>\\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function pad(n){return String(n).padStart(2,'0')}function clamp(n,min,max){return Math.max(min,Math.min(max,n))}\nfunction normalizeLang(v){v=String(v||'').toLowerCase();if(v==='kr')v='ko';return v==='en'?'en':'ko'}\nfunction applyTranslations(){document.documentElement.lang=currentLang;document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'))});document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.getAttribute('data-i18n-placeholder'))});let w=document.getElementById('sampleWatermark');if(w)w.textContent=t('sample');syncDemo();setStatus(window.__lastStatus||'err',true)}\nfunction statusKey(s){let v=String(s||'').toLowerCase().trim().replace(/[\\s_-]+/g,'');if(['secure','safe','success','ok','pass','passed','normal','양호'].includes(v))return 'secure';if(['weak','warning','warn','vulnerable','risk','취약','미흡'].includes(v))return 'weak';if(['fail','failed','error','danger','실패'].includes(v))return 'fail';if(['uncheckable','unchecked','unscanned','notscanned','notchecked','notcheck','점검안함','점검안함','미점검'].includes(v))return 'none';return v? (v.includes('secure')?'secure':v.includes('weak')?'weak':v.includes('fail')?'fail':(v.includes('unscanned')||v.includes('notscanned')?'none':'none')):'none'}\nfunction statusText(s){let k=statusKey(s);return k==='secure'?t('secure'):k==='weak'?t('weak'):k==='fail'?t('fail'):t('unchecked')}function statusClass(s){let k=statusKey(s);return k==='secure'?'b-secure':k==='weak'?'b-weak':k==='fail'?'b-fail':'b-none'}\nfunction scoreColor(score){return score>=90?'#15803d':score>=80?'#2563eb':score>=70?'#a16207':score>=60?'#c2410c':'#dc2626'}\nfunction checkName(k){return (CHECK_LABELS[k]&&CHECK_LABELS[k][currentLang])||friendlyKey(k)}\nfunction getChecks(row){let result=row.result||row.results||row.vulnerabilityCheckResult||{};if(Array.isArray(result)){return result.map((x,i)=>({key:x.key||x.name||x.item||String(i),name:x.label||x.title||x.name||checkName(x.key||String(i)),status:x.status||x.result||x.checkStatus,detail:x.detail||x.details||x.value||null}))}return Object.keys(result).map(k=>{let v=result[k]||{};return {key:k,name:checkName(k),status:v.status||v.result||v.checkStatus,detail:v.detail??v.details??v.value??v}})}\nfunction countChecks(row){let checks=getChecks(row);let c={secure:0,weak:0,fail:0,none:0,total:checks.length};checks.forEach(x=>{let k=statusKey(x.status);if(k==='secure')c.secure++;else if(k==='weak')c.weak++;else if(k==='fail')c.fail++;else c.none++});return c}\nfunction calcScore(row){let c=countChecks(row);let mode=document.getElementById('scoreMode')?.value||'exclude';let denominator=mode==='include'?c.total:(c.secure+c.weak+c.fail);if(!denominator)return 0;let score=(c.secure/denominator)*100;return Math.round(clamp(score,0,100))}\nfunction normalizeRow(r,idx){let c=countChecks(r);let score=calcScore(r);return {...r,_id:'pc-'+idx+'-'+Math.random().toString(36).slice(2),name:r.name||r.userName||r.memberName||'-',departmentName:r.departmentName||r.departmentFull||r.department||'-',computerName:r.computerName||r.deviceName||r.hostName||'-',osType:r.osType||r.os||'-',osUserName:r.osUserName||r.osUser||'-',email:r.email||r.userEmail||'',dateOfEntry:r.dateOfEntry||r.createdAt||r.updatedAt||'',_score:score,_count:c,_checks:getChecks(r)}}\nfunction setStatus(cls,keep){window.__lastStatus=cls;let el=document.getElementById('statusBadge'),tx=document.getElementById('statusText');if(!el||!tx)return;el.className='status-badge '+cls;if(cls==='ok'&&!keep)window.__lastConnectedAt=new Date();if(cls==='loading'){tx.textContent=t('connecting');return}if(cls==='ok'){let d=window.__lastConnectedAt||new Date();let tm=d.toLocaleTimeString(currentLang==='ko'?'ko-KR':'en-US',{hour:'2-digit',minute:'2-digit'});tx.textContent=`${t('connected')}(${tm})`;return}tx.textContent=t('disconnected')}\nfunction hideApiError(){let e=document.getElementById('apiError');if(e){e.style.display='none';e.textContent=''}}function showApiError(msg){let e=document.getElementById('apiError');if(e){e.style.display='block';e.textContent=msg}}\nfunction rebuild(){DATA=RAW.map(normalizeRow).sort((a,b)=>a._score-b._score||String(a.computerName).localeCompare(String(b.computerName)));page=1;applyFilters();renderAll()}\nfunction inBand(score,band){if(!band)return true;if(band==='90')return score>=90;if(band==='80')return score>=80&&score<90;if(band==='70')return score>=70&&score<80;if(band==='60')return score>=60&&score<70;if(band==='50')return score<=50;return true}\nfunction sortFiltered(){let mode=document.getElementById('sortSel')?.value||'scoreAsc';FILTERED.sort((a,b)=>{let d=mode==='scoreDesc'?b._score-a._score:a._score-b._score;if(d!==0)return d;return String(a.computerName||'').localeCompare(String(b.computerName||''));})}\nfunction applyFilters(){let q=(document.getElementById('q')?.value||'').toLowerCase(),band=document.getElementById('scoreFilter')?.value||'',sf=document.getElementById('statusFilter')?.value||'';FILTERED=DATA.filter(r=>{let hay=[r.name,r.email,r.departmentName,r.computerName,r.osType,r.osUserName].join(' ').toLowerCase();let weak=(r._count.weak+r._count.fail)>0;let graphOk=true;if(graphFilter.type==='dept')graphOk=(r.departmentName||'-')===graphFilter.label;if(graphFilter.type==='weak')graphOk=r._checks.some(c=>(c.name===graphFilter.label)&&['weak','fail'].includes(statusKey(c.status)));return graphOk&&(!q||hay.includes(q))&&inBand(r._score,band)&&(!sf||(sf==='weak'?weak:!weak))});sortFiltered();renderAll()}\nfunction renderAll(){renderStats();renderGraphs();renderCards();renderActiveFilter();applyTranslations()}\nfunction rowsByBand(b){return DATA.filter(r=>inBand(r._score,b))}\nfunction renderStats(){let cards=[['totalPc',DATA.length,'',null,'var(--blue)'],['nineties',rowsByBand('90').length,'90-100','90','var(--green)'],['eighties',rowsByBand('80').length,'80-89','80','var(--blue)'],['seventies',rowsByBand('70').length,'70-79','70','var(--amber)'],['sixties',rowsByBand('60').length,'60-69','60','var(--orange)'],['under50',rowsByBand('50').length,'0-50','50','var(--red)']];document.getElementById('statGrid').innerHTML=cards.map(c=>`<div class=\"stat\" style=\"--c:${c[4]}\" onclick=\"filterBand('${c[3]||''}')\"><div class=\"lbl\">${esc(t(c[0]))}<\/div><div class=\"val\">${Number(c[1]).toLocaleString()}<\/div><div class=\"sub\">${c[2]||t('pcs')}<\/div><\/div>`).join('')}\nfunction filterBand(b){graphFilter={type:'',label:''};document.getElementById('scoreFilter').value=b;applyFilters()}\nfunction setGraphFilter(type,label){graphFilter={type:type,label:label};page=1;applyFilters()}\nfunction clearGraphFilter(){graphFilter={type:'',label:''};page=1;applyFilters()}\nfunction renderActiveFilter(){let el=document.getElementById('activeFilter');if(!el)return;if(!graphFilter.type){el.classList.remove('show');el.innerHTML='';return}let prefix=graphFilter.type==='dept'?t('deptAvg'):t('weakTop');el.classList.add('show');el.innerHTML=`${esc(prefix)}: ${esc(graphFilter.label)} <button onclick=\"clearGraphFilter()\" title=\"${esc(t('clearFilter'))}\">×<\/button>`}\nfunction avg(rows){return rows.length?Math.round(rows.reduce((s,r)=>s+r._score,0)/rows.length):0}\nfunction renderGraphs(){let overall=avg(DATA),box=document.getElementById('overallScoreBox');box.style.setProperty('--score',scoreColor(overall));box.innerHTML=`<strong>${overall}<\/strong><span>${t('score')}<\/span>`;document.getElementById('scoreModeHint').textContent=document.getElementById('scoreMode').value==='include'?t('includeHint'):t('excludeHint');document.getElementById('overallScoreDesc').textContent=t('avgDesc')(overall,DATA.length);let dept={};DATA.forEach(r=>{let k=r.departmentName||'-';(dept[k]||(dept[k]=[])).push(r)});let deptStats=Object.entries(dept).map(([k,rows])=>[k,rows,avg(rows)]).sort((a,b)=>a[2]-b[2]).slice(0,10);renderBars('deptBars',deptStats.map(x=>[x[0],x[1],x[2]]),'dept');let weak={};DATA.forEach(r=>r._checks.forEach(c=>{let k=statusKey(c.status);if(k==='weak'||k==='fail')weak[c.name]=(weak[c.name]||0)+1}));let weakStats=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>[x[0],Array(x[1]).fill(0),x[1]]);renderBars('weakBars',weakStats,'weak')}\nfunction renderBars(id,stats,type){let el=document.getElementById(id);if(!stats.length){el.innerHTML=`<div class=\"empty\">${t('none')}<\/div>`;return}let max=Math.max(1,...stats.map(x=>type==='dept'?100:x[2]));el.innerHTML=stats.map(x=>{let label=x[0],value=x[2],pct=type==='dept'?value:(value/max*100);let text=type==='dept'?`${value}${t('score')} · ${x[1].length}${t('pcs')}`:`${value}${t('pcs')}`;return `<div class=\"bar\" onclick=\"setGraphFilter('${type}','${esc(label)}')\" title=\"${esc(t('filtering'))}\"><div class=\"bar-head\"><span class=\"bar-name\">${esc(label)}<\/span><span class=\"bar-count\">${esc(text)}<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"width:${clamp(pct,2,100)}%;background:${type==='dept'?scoreColor(value):'linear-gradient(90deg,#dc2626,#f97316)'}\"><\/div><\/div><\/div>`}).join('')}\nfunction renderCards(){let size=parseInt(document.getElementById('pageSize').value||'50',10),total=FILTERED.length,tp=Math.max(1,Math.ceil(total/size));if(page>tp)page=tp;let st=(page-1)*size,en=Math.min(st+size,total),rows=FILTERED.slice(st,en);document.getElementById('totalCnt').textContent=`${t('total')} ${total.toLocaleString()}${t('pcs')}`;document.getElementById('pageInfo').textContent=total?`${st+1}-${en} / ${total}`:'0 / 0';document.getElementById('cardGrid').innerHTML=rows.length?rows.map(cardHtml).join(''):`<div class=\"empty\">${t('none')}<\/div>`;renderPages(tp)}\nfunction cardHtml(r){let checks=r._checks.slice(0,9);let more=Math.max(0,r._checks.length-checks.length);return `<article class=\"pc-card\"><div class=\"pc-head\"><div class=\"pc-title\"><b>${esc(r.computerName)}<\/b><small>${esc(r.name)} · ${esc(r.departmentName)}<\/small><small>${esc(r.osType)} · ${esc(r.osUserName)}<\/small><\/div><div class=\"score\" style=\"--score:${scoreColor(r._score)}\"><strong>${r._score}<\/strong><span>${t('score')}<\/span><\/div><\/div><div class=\"mini-summary\"><div class=\"mini\"><b>${r._count.secure}<\/b><span>${t('secure')}<\/span><\/div><div class=\"mini\"><b>${r._count.weak}<\/b><span>${t('weak')}<\/span><\/div><div class=\"mini\"><b>$  Key':'Secret Key',\n      'Language':'言語'\n    }\n  };\n\n  const textSource = new WeakMap();\n  const attrSource = new WeakMap();\n  let applying = false;\n  let pending = false;\n\n  window.EXOSP_CURRENT_LANG = window.EXOSP_CURRENT_LANG || 'ko';\n\n  function getHashLang(){\n    try{\n      const p = new URLSearchParams(String(location.hash || '').replace(/^#/,''));\n      return p.get('lang') || p.get('hl') || p.get('hubLang') || '';\n    }catch(e){ return ''; }\n  }\n\n  function normalizeLang(v){\n    v = String(v || '').toLowerCase();\n    if(v === 'kr') v = 'ko';\n    if(v === 'jp') v = 'ja';\n    return (v === 'ko' || v === 'en' || v === 'ja') ? v : '';\n  }\n\n  function lang(){\n    return normalizeLang(window.EXOSP_CURRENT_LANG) || normalizeLang(getHashLang()) || 'ko';\n  }\n\n  function translateText(src, targetLang){\n    if(targetLang === 'ko') return src;\n    const map = EXACT[targetLang] || {};\n    let out = src;\n\n    const sorted = Object.keys(map).sort((a,b)=>b.length-a.length);\n    for(const k of sorted){\n      out = out.split(k).join(map[k]);\n    }\n\n    if(targetLang === 'en'){\n      out = out\n        .replace(/연결성공\\(([^)]+)\\)/g, 'Connected ($1)')\n        .replace(/총\\s*([0-9,]+)건/g, 'Total $1')\n        .replace(/총\\s*([0-9,]+)개 대상/g, 'Total $1 targets')\n        .replace(/최근\\s*([0-9:.\\/\\-\\s]+)\\s*·/g, 'Latest $1 ·')\n        .replace(/([0-9,]+)대/g, '$1 devices')\n        .replace(/([0-9]{2}\\.[0-9]{2})주/g, 'Week of $1')\n        .replace(/(\\d+)-(\\d+)\\s*\\/\\s*(\\d+)/g, '$1-$2 / $3');\n    } else if(targetLang === 'ja'){\n      out = out\n        .replace(/연결성공\\(([^)]+)\\)/g, '接続成功($1)')\n        .replace(/총\\s*([0-9,]+)건/g, '全$1件')\n        .replace(/총\\s*([0-9,]+)개 대상/g, '全$1対象')\n        .replace(/최근\\s*([0-9:.\\/\\-\\s]+)\\s*·/g, '直近 $1 ·')\n        .replace(/([0-9,]+)대/g, '$1台')\n        .replace(/([0-9]{2}\\.[0-9]{2})주/g, '$1週')\n        .replace(/(\\d+)-(\\d+)\\s*\\/\\s*(\\d+)/g, '$1-$2 / $3');\n    }\n    return out;\n  }\n\n  function translateAttr(src, targetLang){\n    if(targetLang === 'ko') return src;\n    return ((ATTR[targetLang]||{})[src]) || translateText(src, targetLang);\n  }\n\n  function walkTextNodes(root, cb){\n    if(!root) return;\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {\n      acceptNode(node){\n        if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;\n        const p = node.parentElement;\n        if(!p) return NodeFilter.FILTER_REJECT;\n        const tag = p.tagName;\n        if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return NodeFilter.FILTER_REJECT;\n        return NodeFilter.FILTER_ACCEPT;\n      }\n    });\n    let n;\n    while((n = walker.nextNode())) cb(n);\n  }\n\n  function applyLanguage(){\n    if(applying) return;\n    applying = true;\n    const targetLang = lang();\n\n    document.documentElement.lang = targetLang;\n\n    walkTextNodes(document.body, function(node){\n      if(!textSource.has(node)) textSource.set(node, node.nodeValue);\n      const src = textSource.get(node);\n      const next = translateText(src, targetLang);\n      if(node.nodeValue !== next) node.nodeValue = next;\n    });\n\n    document.querySelectorAll('[placeholder], [title], [aria-label]').forEach(function(el){\n      ['placeholder','title','aria-label'].forEach(function(attr){\n        if(!el.hasAttribute(attr)) return;\n        let store = attrSource.get(el);\n        if(!store){ store = {}; attrSource.set(el, store); }\n        if(!store[attr]) store[attr] = el.getAttribute(attr);\n        const next = translateAttr(store[attr], targetLang);\n        if(el.getAttribute(attr) !== next) el.setAttribute(attr, next);\n      });\n    });\n\n    applying = false;\n  }\n\n  function scheduleApply(){\n    if(pending) return;\n    pending = true;\n    setTimeout(function(){\n      pending = false;\n      applyLanguage();\n    }, 0);\n  }\n\n  window.setLanguage = function(nextLang){\n    cons function hasVisibleLeaf(node,state){if(!node.children)return node.id.startsWith('studio.') || (state[node.id]&&state[node.id].active); return node.children.some(c=>hasVisibleLeaf(c,state));}

function renderNode(n,level,state){const children=(n.children||[]).filter(c=>hasVisibleLeaf(c,state)); const has=children.length>0; if(has){const cls=level===1?'menu-title':'sub-title level-'+level; const openClass=menuAllOpen?' open':''; return '<div class="menu-section'+openClass+'" data-node="'+esc(n.id)+'"><button type="button" class="'+cls+'" data-toggle="'+esc(n.id)+'" data-tip="'+esc(n.label)+'">'+icon(n)+'<span class="label">'+esc(n.label)+'</span><span class="chev">›</span></button><div class="children">'+children.map(c=>renderNode(c,level+1,state)).join('')+'</div></div>';}
